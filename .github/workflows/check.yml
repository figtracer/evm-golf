name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    # Run independent suites separately so each bounds its own cold setup and checks.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, regions, jumps]
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Install compression tools
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes zstd
          fi
      - name: Install Lean
        if: matrix.suite == 'core'
        run: bash scripts/setup-lean.sh
      - name: Check Rust and Lean proofs
        if: matrix.suite == 'core'
        run: bash scripts/check.sh
      - name: Install pinned upstream semantics
        if: matrix.suite != 'core'
        run: |
          if [[ "${{ matrix.suite }}" == jumps ]]; then
            bash scripts/setup-upstream.sh --checked-scanner
          else
            bash scripts/setup-upstream.sh
          fi
      - name: Check upstream region certificate
        if: matrix.suite == 'regions'
        run: bash scripts/check-upstream.sh
      - name: Check canonical static jumps
        if: matrix.suite == 'jumps'
        run: bash scripts/check-checked-scanner.sh
