[package]
name = "evm-golf"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Verified gas optimization for deployed EVM contracts."
repository = "https://github.com/figtracer/evm-golf"
readme = "README.md"
keywords = ["evm", "optimization", "gas", "lean"]
publish = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
revm = { version = "43.0.3", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.23.0"
